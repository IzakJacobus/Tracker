name: Release

# Builds installers when a version tag is pushed (git tag v1.2.0 && git push origin v1.2.0).
# Everything is attached to a DRAFT GitHub Release: check it, then click Publish.
# Running servers only see a release once it is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  WINSW_URL: https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe
  WINSW_SHA256: 05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Check versions match the tag
        run: |
          v="${TAG#v}"
          grep -q "\"version\": \"$v\"" package.json || { echo "package.json version isn't $v. Run: bun scripts/set-version.ts $v"; exit 1; }
          grep -q "\"version\": \"$v\"" apps/desktop/src-tauri/tauri.conf.json || { echo "tauri.conf.json version isn't $v"; exit 1; }
      - name: Release notes from CHANGELOG
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Stint $TAG" --notes-file notes.md

  server-windows:
    name: Server installer (Windows)
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --filter @stint/web build
      - name: Build stint-server.exe
        run: bun apps/server/scripts/build.ts --target windows-x64
      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item apps/server/dist/stint-server-windows-x64.exe stage/stint-server.exe
          Invoke-WebRequest $env:WINSW_URL -OutFile stage/stint-server-service.exe
          $hash = (Get-FileHash stage/stint-server-service.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINSW_SHA256) { throw "WinSW checksum mismatch: $hash" }
          Copy-Item installer/windows/stint-server-service.xml stage/
          Copy-Item LICENSE stage/LICENSE.txt
          Copy-Item apps/desktop/src-tauri/icons/icon.ico stage/stint.ico
      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ";C:\Program Files (x86)\NSIS"
          }
          $v = $env:TAG.TrimStart('v')
          makensis -V2 "-DVERSION=$v" "-DSRC=$PWD\stage" "-DOUTFILE=$PWD\StintServer-Setup-$v.exe" installer/windows/server.nsi
          Compress-Archive -Path stage/stint-server.exe, stage/LICENSE.txt -DestinationPath "stint-server-$v-windows-x64-portable.zip"
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" StintServer-Setup-*.exe stint-server-*-portable.zip --clobber

  server-unix:
    name: Server binaries (Linux, macOS)
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --filter @stint/web build
      - name: Build
        run: |
          for t in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            bun apps/server/scripts/build.ts --target "$t"
          done
      - name: Package
        run: |
          v="${TAG#v}"
          for t in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            d="stint-server-$v-$t"
            mkdir "$d"
            cp "apps/server/dist/stint-server-$t" "$d/stint-server"
            cp LICENSE "$d/"
            cp installer/linux/stint-server.service installer/linux/install.sh "$d/"
            tar -czf "$d.tar.gz" "$d"
          done
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" stint-server-*.tar.gz installer/linux/get-stint.sh --clobber

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: bun install --frozen-lockfile
      # tauri.conf.json's beforeBuildCommand builds the web client.
      - name: Build bundles
        working-directory: apps/desktop
        run: bunx tauri build
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          b=apps/desktop/src-tauri/target/release/bundle
          files=("$b"/nsis/*.exe "$b"/dmg/*.dmg "$b"/deb/*.deb "$b"/appimage/*.AppImage)
          [ ${#files[@]} -gt 0 ] || { echo "No bundles found"; ls -R "$b" || true; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber

  checksums:
    name: Checksums
    needs: [draft, server-windows, server-unix, desktop]
    if: always() && needs.draft.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
