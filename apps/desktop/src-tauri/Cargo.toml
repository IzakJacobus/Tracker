[package]
name = "stint-desktop"
version = "0.1.0"
description = "Stint desktop app: time tracking that works offline and pairs with your office Stint Server"
authors = ["Stint contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "stint_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
x509-parser = "0.16"
sha2 = "0.10"
base64 = "0.22"
mdns-sd = "0.13"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_Foundation"] }

# Both are already part of the Tauri build on Linux; listed so idle detection can use them.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
libloading = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
